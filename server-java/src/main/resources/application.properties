# ============================================================
# HMS Spring Boot Backend - Application Configuration
# ============================================================
# This file is read on startup. Values in ${VAR:default} mean:
#   - Use the environment variable VAR if it exists
#   - Otherwise fall back to the "default" value after the colon

# --- Server ---
server.port=8080

# --- MongoDB ---
# The Java backend connects to a fresh local MongoDB Community install.
# Set MONGO_URI in your environment or create a server-java/.env file
# (not natively supported by Spring Boot; see README for how to use it).
# Default: local MongoDB on standard port 27017, database name "hms"
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/hms}

# --- JWT ---
# IMPORTANT: Change this secret in production. Must be at least 32 characters
# for the HS256 algorithm used here.
jwt.secret=${JWT_SECRET:hms-dev-secret-key-32chars-minimum-change-in-prod}
# Token expiry: 7 days in milliseconds (7 * 24 * 60 * 60 * 1000)
jwt.expiration-ms=604800000

# --- Jackson (JSON serialization) ---
# Write Java date/time types as ISO-8601 strings, not as numeric timestamps.
# e.g., "2024-01-15T10:30:00Z" instead of 1705316200000
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logging ---
# DEBUG level for our own code so we can see what's happening during development
logging.level.com.hms=DEBUG
# Reduce Spring Security noise (it logs a lot at DEBUG)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

# --- Application name ---
spring.application.name=hms
